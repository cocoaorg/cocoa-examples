# As cocoa_config.yaml, with SWAN's ST6 source terms in place of KOMEN.
# ST6's coefficients are fixed (the Day and Dietrich configuration for
# ADCIRC+SWAN), so the whitecapping keys are refused with it.

mesh:
  filename: "beach.nc"        # written by make_inputs.py
  projection:
    type: "EquidistantCylindrical"
    center: [-89.9, 29.02]

simulation:
  start_time: 2026-04-01
  end_time: 2026-04-01 12:00:00
  time_step: 4s

physics:
  manning_n: 0.025
  cf_lower_limit: 0.0025
  tau0: 0.02
  h0: 0.05

numeric:
  solver: explicit

forcing:
  # No tide: the open boundary holds initial_conditions.water_level (0 m), so
  # everything the shore sees is wind setup, plus wave setup where waves run.
  ramp:
    enabled: true
    duration: 3h
  meteorological:
    enabled: true
    format: cf_netcdf
    filename: "wind.nc"       # written by make_inputs.py
  wave:
    enabled: true
    ramp:
      duration: 3h
    model:
      sources:
        physics: st6

output:
  global:
    filename: "st6_output.nc"
    step_interval: 30m
    variables:
      pressure: false
      wave_force: true
      wave_hs: true
      wave_dir: true
      wave_tm01: true
  stations:
    filename: "st6_stations.nc"
    step_interval: 10m
    locations: {include: stations.yaml}

diagnostics:
  screen_interval: 1h
