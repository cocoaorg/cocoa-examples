# cocoa_config.yaml without the baroclinic forcing: the barotropic baseline.

mesh:
  filename: "../wnat/wnat.nc"
  projection:
    type: "EquidistantCylindrical"
    center: [-76.572766, 23.241697]

simulation:
  start_time: 2026-02-01
  end_time: 2026-02-06
  time_step: 20s

physics:
  manning_n: 0.025
  cf_lower_limit: 0.0010
  tau0: 0.005

numeric:
  solver: explicit

forcing:
  ramp:
    enabled: true
    duration: 1d
  tide:
    potential:
      enabled: true
    boundary: {include: tide_boundary.yaml}

output:
  global:
    filename: "barotropic_output.nc"
    step_interval: 1h
    variables:
      pressure: false
      wind: false

diagnostics:
  screen_interval: 12h
